<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Great Photography, Distilled</title>
  <link rel="preload" as="image" href="assets/bakgrund2.webp" fetchpriority="high" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="shell">
    <header class="appHeader">
      <h1>Great Photography, Distilled</h1>
      <p>Study the masters. Learn the tools. Evolve faster.</p>
    </header>

    <main id="pickerView" class="view"></main>

    <section id="stackView" class="view hidden">
      <div class="stackTopbar">
        <button id="backBtn" type="button" class="uiBtn">Back</button>
        <div class="stackMeta">
          <div id="stackTitle" class="stackTitle"></div>
          <div id="lessonIndicator" class="lessonIndicator">1 / 1</div>
        </div>
      </div>
      <div id="stackScroller" class="stackScroller"></div>
    </section>
  </div>

  <aside id="panel" class="panel hidden" aria-hidden="true">
    <div id="panelScrim" class="panelScrim"></div>
    <div class="panelCard">
      <div class="panelHead">
        <div id="panelTitle" class="panelTitle">Panel</div>
        <button id="panelClose" type="button" class="uiBtn">Close</button>
      </div>
      <div class="panelTabs">
        <button id="tabExercise" type="button" class="tabBtn">Exercise</button>
        <button id="tabDeepDive" type="button" class="tabBtn">Deep Dive</button>
      </div>
      <div id="panelBody" class="panelBody"></div>
    </div>
  </aside>

  <script src="data/blocks.js"></script>
  <script src="data/panels.js"></script>
  <script src="app.js"></script>
</body>
</html>
